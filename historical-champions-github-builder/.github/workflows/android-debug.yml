name: Build Historical Champions Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK (no Android Studio required)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android command-line SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences and install platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: npm run android:debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-champions-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
